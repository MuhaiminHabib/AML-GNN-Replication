experiment_name: weber_2019_gcn_replication
paper: Weber et al. 2019
dataset: elliptic

task:
  type: node_classification
  target: illicit_vs_licit

split:
  type: temporal
  train_timesteps: [1, 34]
  test_timesteps: [35, 49]
  validation: null

model:
  name: gcn
  num_layers: 2
  hidden_dim: 100
  dropout: 0.5

training:
  epochs: 1000
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  seeds: [42]

metrics:
  - illicit_precision
  - illicit_recall
  - illicit_f1
  - micro_f1