experiment_name: marasi_2024_gnn_comparison_replication
paper: Marasi and Ferretti 2024
dataset: elliptic

task:
  type: node_classification
  target: illicit_vs_licit

split:
  type: stratified
  train_ratio: 0.65
  validation_ratio: 0.15
  test_ratio: 0.20
  maintain_label_proportion: true

models:
  - gcn
  - gat
  - gatv2
  - graphsage
  - chebnet

training:
  optimizer: adam
  seeds: [42]
  epochs: null
  learning_rate: null

metrics:
  - illicit_precision
  - illicit_recall
  - illicit_f1
  - accuracy
